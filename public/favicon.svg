<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="faviconCircleClip">
      <circle cx="50" cy="50" r="38.5" />
    </clipPath>
  </defs>

  <!-- Dark Container Background -->
  <rect width="100" height="100" rx="22" fill="#020617"/>
  
  <!-- Outer Globe Ring -->
  <circle cx="50" cy="50" r="34" stroke="#ffffff" stroke-width="9"/>
  
  <!-- Left Half Axis (White, Thickness = 9px) -->
  <line x1="16" y1="50" x2="50" y2="50" stroke="#ffffff" stroke-width="9" stroke-linecap="butt"/>
  
  <!-- Right Half Axis (Red, Thickness = 13.5px = 1.5x White) with Curved Finish -->
  <g clip-path="url(#faviconCircleClip)">
    <line x1="50" y1="50" x2="92" y2="50" stroke="#f43f5e" stroke-width="13.5" stroke-linecap="butt"/>
  </g>
  
  <!-- High-Contrast Red Alert Marker -->
  <circle cx="72" cy="22" r="13" fill="#f43f5e"/>
  <circle cx="72" cy="22" r="5" fill="#ffffff"/>
</svg>
